description: 纯音频转录 + 摘要 — Whisper ASR + LLM MapReduce
version: "1.0"
updated_at: "2026-07-08T00:00:00Z"
updated_by: "admin"
config:
  # ── 模型选择 ──
  llm: deepseek-v4-flash-202605
  embedding: qwen3-embedding:8b
  asr: openai_compatible:large-v3

  # ── 连接信息（host / api_key）默认从 env 读取，不写入 preset ──
  # LLM/Embedding: LightRAG server 侧 env；ASR: ASR_BASE_URL / ASR_API_KEY

  # ── ASR ──
  asr_binding: openai_compatible
  asr_model: large-v3

  # ── 解析与模态 ──
  parser: mineru
  modalities:
    - audio
  output_dir: /data/output
  profile: dev

  # ── 音频处理调优 ──
  audio_asr_timeout: 1200
  max_parallel_asr: 1
  audio_chunk_token_size: 600
  audio_summarize_batch_size: 8
  audio_summarize_max_batches: 20

  # ── 只开音频，关闭其他模态 ──
  enable_image_processing: false
  enable_table_processing: false
  enable_equation_processing: false
  enable_video_processing: false

  # LightRAG tuning (passed via lightrag_kwargs)
  embedding_batch_num: 2
