# ============================================================
# 能力运行时清单（capability runtime manifest）
# ------------------------------------------------------------
# 用途：声明每个原子能力以何种方式落地
#   - local  : 进程内直连本地适配器（默认）
#   - remote : 通过 Sidecar (`endpoint`) 反代到独立部署的能力服务
#   - mock   : 进程内桩实现（测试 / 离线开发）
#
# 加载顺序：
#   1) 环境变量 CAPABILITY_RUNTIME_FILE 指向的文件
#   2) 项目根目录 capability_runtime.yaml
#   3) 内置默认（全部 local）
#
# 切换部署画像（单体 / 分层 / 全分布式）只需修改本文件，
# 不需要改业务代码。
# ============================================================

atomic:
  # 简写键（默认拼成 atomic.<key>.v1）
  llm.qwen:
    mode: local
    options:
      timeout: 30

  vector.milvus:
    mode: local

  audio.asr:
    mode: local

  rag.lightrag:
    mode: remote
    endpoint: ${SIDECAR_URL:-http://localhost:8001}
    options:
      timeout: 60

  # 远程示例：把 ASR 拆成独立服务时这样写
  # audio.asr:
  #   mode: remote
  #   endpoint: ${SIDECAR_URL:-http://localhost:8001}
  #   options:
  #     timeout: 60

  # 测试场景示例
  # llm.qwen:
  #   mode: mock
  #   options:
  #     embedding_dim: 1536

# 也支持声明 domain / business 能力
domain:
  domain.rag.text.v1:
    mode: remote
    endpoint: ${SIDECAR_URL:-http://localhost:8001}
    options:
      timeout: 60

